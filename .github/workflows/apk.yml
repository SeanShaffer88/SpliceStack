name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          ls ~/.local/share/godot/export_templates/4.3.stable/ || true

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la ~/.android/

      - name: Configure Godot editor settings for Android export
        run: |
          mkdir -p ~/.config/godot
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android-sdk}}"
          echo "Using Android SDK path: $SDK_PATH"
          ls "$SDK_PATH" || true
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # Godot 4.3 reads editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Verify Godot headless logic harness
        run: godot --headless --path . -s tests/test_mvp.gd

      - name: Export Android APK (debug-signed)
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/SpliceStack.apk
          ls -la build/

      - name: Inspect APK
        run: |
          file build/SpliceStack.apk || true
          unzip -l build/SpliceStack.apk | head -30 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpliceStack-apk
          path: build/SpliceStack.apk
          if-no-files-found: error
